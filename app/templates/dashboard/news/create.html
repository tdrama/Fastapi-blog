{% extends "base.html" %}

{% block title %}Create News Article - BAMTECH Dashboard{% endblock %}

{% block content %}

<div class="p-6 max-w-4xl mx-auto space-y-6"><!-- HEADER -->
<div class="flex justify-between items-center mb-6">
    <div>
        <h1 class="text-3xl font-bold text-gray-900">
            Create News Article
        </h1>

        <p class="text-gray-500 mt-1">
            Publish rich text layout articles and blog reports
        </p>
    </div>

    <a
        href="/dashboard/news"
        class="bg-black hover:bg-gray-800 text-white px-5 py-3 rounded-xl transition font-medium shadow text-center"
    >
        ← Back to Articles
    </a>
</div>


<!-- CREATION CARD -->
<div class="bg-white p-6 rounded-2xl shadow border border-gray-100">

    <form
        id="newsCreationForm"
        action="/dashboard/news/create"
        method="POST"
        enctype="multipart/form-data"
        class="space-y-5"
    >

        <!-- CSRF -->
        <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token }}"
        >


        <!-- TITLE -->
        <div>
            <label
                for="title"
                class="block mb-1.5 font-semibold text-gray-700 text-sm"
            >
                Article Title *
            </label>

            <input
                type="text"
                id="title"
                name="title"
                placeholder="Enter headline text"
                required
                class="w-full border border-gray-300 p-3 rounded-xl outline-none focus:ring-2 focus:ring-black transition font-medium"
            >
        </div>


        <!-- CATEGORY -->
        <div>

            <label
                for="category_id"
                class="block mb-1.5 font-semibold text-gray-700 text-sm"
            >
                Category Selection *
            </label>

            <select
                id="category_id"
                name="category_id"
                required
                class="w-full border border-gray-300 p-3 rounded-xl bg-white outline-none cursor-pointer"
            >

                <option value="" disabled selected>
                    Select an article category
                </option>

                {% for cat in categories %}

                    <option value="{{ cat.id }}">
                        {{ cat.name|e }}
                    </option>

                {% endfor %}

            </select>

        </div>


        <!-- RICH TEXT EDITOR -->
        <div>

            <label
                for="news-content-editor"
                class="block mb-1.5 font-semibold text-gray-700 text-sm"
            >
                Article Body Content *
            </label>

            <textarea
                id="news-content-editor"
                name="content"
                placeholder="Compose article contents here..."
            ></textarea>

        </div>


        <!-- FEATURE IMAGE -->
        <div>

            <label
                for="news-image"
                class="block mb-1.5 font-semibold text-gray-700 text-sm"
            >
                Featured Banner Image
            </label>

            <input
                type="file"
                id="news-image"
                name="image"
                accept="image/*"
                class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:bg-gray-100 hover:file:bg-gray-200 cursor-pointer border p-2.5 rounded-xl"
            >

            <p class="text-xs text-gray-400 mt-1">
                Leave empty if no graphics asset is needed.
            </p>

        </div>


        <!-- ACTIONS -->
        <div class="flex gap-3 pt-2">

            <button  
                type="submit"
                class="bg-green-600 hover:bg-green-700 text-white px-6 py-3.5 rounded-xl font-semibold transition shadow-sm w-full cursor-pointer"
            >
                Publish News Article
            </button>

            <a
                href="/dashboard/news"
                class="bg-gray-100 hover:bg-gray-200 text-gray-800 px-6 py-3.5 rounded-xl font-semibold transition text-center w-full"
            >
                Cancel
            </a>

        </div>

    </form>

</div>

</div>


 <script>
$(document).ready(function () {

    console.log("jQuery loaded:", typeof jQuery);
    console.log("Summernote loaded:", typeof $.fn.summernote);


    if (typeof $.fn.summernote === "undefined") {

        console.error(
            "Summernote is NOT loaded. Check base.html and CSP."
        );

        return;
    }


    $('#news-content-editor').summernote({

        placeholder: 'Compose article contents here...',

        tabsize: 2,

        height: 400,

        toolbar: [

            ['style', ['style']],

            [
                'font',
                [
                    'bold',
                    'underline',
                    'clear',
                    'italic'
                ]
            ],

            ['color', ['color']],

            [
                'para',
                [
                    'ul',
                    'ol',
                    'paragraph'
                ]
            ],

            ['table', ['table']],

            [
                'insert',
                [
                    'link',
                    'picture',
                    'video'
                ]
            ],

            [
                'view',
                [
                    'fullscreen',
                    'codeview',
                    'help'
                ]
            ]

        ],

        callbacks: {

            onChange: function (contents) {

                $('#news-content-editor').val(contents);

            },

            onImageUpload: function (files) {

                if (files && files.length) {

                    if (typeof uploadEditorMediaFile === 'function') {

                        uploadEditorMediaFile(
                            files[0],
                            'image'
                        );

                    } else {

                        console.warn(
                            'uploadEditorMediaFile() is not defined.'
                        );

                    }

                }

            }

        }

    });


    /*
     * DRAG & DROP MEDIA
     */

    $('.note-editable').on('drop', function (e) {

        const dataTransfer =
            e.originalEvent.dataTransfer;

        if (
            !dataTransfer ||
            !dataTransfer.files ||
            !dataTransfer.files.length
        ) {
            return;
        }


        const file =
            dataTransfer.files[0];

        const ext =
            file.name
                .split('.')
                .pop()
                .toLowerCase();


        if (
            ['mp4', 'webm', 'ogg', 'mov']
                .includes(ext)
        ) {

            e.preventDefault();

            if (
                typeof uploadEditorMediaFile ===
                'function'
            ) {

                uploadEditorMediaFile(
                    file,
                    'video'
                );

            }

        }

        else if (ext === 'pdf') {

            e.preventDefault();

            if (
                typeof uploadEditorMediaFile ===
                'function'
            ) {

                uploadEditorMediaFile(
                    file,
                    'pdf'
                );

            }

        }

    });

});

</script>{% endblock %}
